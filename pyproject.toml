# uv workspace for the DevOps Agent project.
#
#   uv sync --all-packages        # install common + server + local agent + dev tools
#   uv run pytest                 # run every Python test suite
#
[project]
name = "devops-agent-workspace"
version = "0.1.0"
description = "Workspace root for the DevOps Agent fleet (server agent + local agents)"
requires-python = ">=3.11"
dependencies = []

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/common", "server", "local_agent"]

[tool.uv.sources]
devops-common = { workspace = true }
devops-server = { workspace = true }
devops-local-agent = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=8.2",
    "ruff>=0.6",
    "httpx>=0.27",
]

[tool.pytest.ini_options]
testpaths = ["packages/common/tests", "server/tests", "local_agent/tests"]
addopts = "-q --import-mode=importlib"

[tool.ruff]
line-length = 110
target-version = "py311"
extend-exclude = ["examples"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501", "B008"]

[tool.ruff.lint.isort]
known-first-party = ["devops_common", "devops_server", "devops_local"]

[tool.ruff.lint.per-file-ignores]
"server/alembic/versions/*" = ["E", "W", "I", "UP"]
