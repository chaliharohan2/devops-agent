[project]
name = "devops-common"
version = "0.1.0"
description = "Shared protocol, manifest spec, read-only git guard, change analysis and compose rendering for DevOps Agent"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["devops_common"]
