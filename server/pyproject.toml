[project]
name = "devops-server"
version = "0.1.0"
description = "DevOps Agent - server agent: merges pushed branches, owns environment configs, runs deployments"
requires-python = ">=3.11"
dependencies = [
    "devops-common",
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0.30",
    "psycopg[binary]>=3.1.19",
    "alembic>=1.13",
    "pydantic-settings>=2.3",
    "cryptography>=42",
    "typer>=0.12",
    "python-multipart>=0.0.9",
]

[project.scripts]
devops-server = "devops_server.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["devops_server"]
