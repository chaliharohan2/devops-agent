[project]
name = "devops-local-agent"
version = "0.1.0"
description = "DevOps Agent - local agent: runs on each developer machine with a local SLM"
requires-python = ">=3.11"
dependencies = [
    "devops-common",
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "typer>=0.12",
    "rich>=13.7",
    "psutil>=5.9",
    "pyyaml>=6.0",
    "httpx>=0.27",
]

[project.scripts]
devops-agent = "devops_local.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["devops_local"]
